[project]
name = "speechmap-site"
version = "0.1.0"
description = "Static site generator and deployable assets for SpeechMap"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cmarkgfm>=2025.10.22",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "playwright>=1.49",
    "pytest>=8",
    "pytest-playwright>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
